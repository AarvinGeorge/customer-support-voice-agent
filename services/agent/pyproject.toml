[project]
name = "quillstack-agent"
version = "0.1.0"
description = "Quillstack support agent service (lane B)"
requires-python = ">=3.12"
# Versions match the day-1 spikes (spikes/agent/SPIKE_NOTES.md).
dependencies = [
    "langchain==1.5.2",
    "langchain-core==1.8.5",
    "langchain-anthropic==1.7.13",
    "langchain-openai==1.8.5",
    "langgraph==1.2.24",
    "langgraph-checkpoint==4.3.2",
    "langgraph-checkpoint-postgres==3.2.1",
    "psycopg[binary,pool]>=3.2",
    "quillstack-contracts",
    "fastapi>=0.115",
    "httpx>=0.27",
    "redis>=5.2",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "fakeredis>=2.26",
    "pytest==9.2.0",
    "pytest-asyncio==1.5.0",
    "python-dotenv>=1.2.4",
]

[tool.uv.sources]
# Non-editable: macOS hides .pth files in .venv and Python 3.13 skips them (BRIEF known trap).
quillstack-contracts = { path = "../../packages/contracts", editable = false }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q -m 'not real'"
markers = ["real: makes real provider calls (deselect with -m 'not real')"]
