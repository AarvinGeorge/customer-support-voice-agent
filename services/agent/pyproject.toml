[project]
name = "quillstack-agent"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "psycopg[binary,pool]>=3.2",
    # LangGraph checkpointer (doc 07 s12); pins match spikes/agent (langgraph-checkpoint 4.3.2).
    "langgraph-checkpoint==4.3.2",
    "langgraph-checkpoint-postgres==3.2.1",
]

[dependency-groups]
dev = ["pytest==9.2.0", "pytest-asyncio==1.5.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"
