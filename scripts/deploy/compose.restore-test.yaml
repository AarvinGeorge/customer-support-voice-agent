# What: a Postgres-only stack for scripts/deploy/restore_pg_test.sh (selected through DEPLOY_COMPOSE_FILES).
# Use when: proving backup and restore against a real Postgres without the Quillstack images. Inputs: none (dummy password, loopback only).
# Output: service `postgres` (pgvector, database quillstack) plus four idle stand-ins for the app services the restore stops and starts.
# Side effects: none beyond the containers and one anonymous volume. Role: test fixture.
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment: {POSTGRES_DB: quillstack, POSTGRES_PASSWORD: dummy-not-a-secret}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d quillstack"]
      interval: 2s
      timeout: 3s
      retries: 30
  agent_a: &idle {image: "busybox:1.36", command: ["sleep", "3600"]}
  agent_b: *idle
  core: *idle
  knowledge: *idle
