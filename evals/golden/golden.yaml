# What: the golden end-to-end cases (about 12 plus the rule and attack cases): persona, turn script (text, card submit,
#   Confirm press, voice), and the expected final rows, reason codes, escalation reason, tool trajectory and forbidden behaviours.
# Use when: the golden runner (CS-E-06.S1.T1) replays a case on a reseeded stack and grades it with code graders;
#   tests/test_golden_set.py validates every case against schema/case.schema.json and resolves every chunk id.
# Inputs: schema/case.schema.json, data/seeds/personas.yaml (persona names), data/policy.yaml (reason codes), fixtures/.
# Output: none (data). Side effects: none.
# Role: source of truth for the M1 golden pass rate (doc G); train and test are reported separately and the test split is never tuned on.
# Notes: {persona.account_id} and {persona.pin} are placeholders the runner resolves; no PIN is written here. A case passes only when the
#   outcome, final rows, trajectory and forbidden-behaviour checks all hold. Chunk ids are the knowledge chunker's output for data/articles.
cases:
  - id: G-01
    title: S1 happy path, Natasha refunds the duplicate $96 charge
    scenario: S1
    split: train
    persona: Natasha Romanoff
    mode: chat
    source: L1 s4 S1; 07 s3.3, s7.3, s6.3; refund-policy#pro-plan-refunds
    notes: "Verification continues the earlier request (07 s6.3 step 5, line 611): the card turn ends where the request ends, not at 'verified'. The request names the charge ending 0412 because 0411 and 0412 are twins."
    turns:
      - {kind: text, text: "I was charged twice for my Pro plan this week. Please refund the duplicate $96 charge ending 0412.", expect: {end_reason: verification_requested}}
      - {kind: verification, credentials: persona, expect: {end_reason: readback}}
      - {kind: confirm, decision: confirm, expect: {end_reason: committed}}
    expected:
      outcome: [action]
      end_reason: committed
      final_state:
        pending_actions: [{action_type: refund, charge_id: CH-00000412, amount_cents: 9600, state: committed}]
        committed_refunds: 1
        tickets: {count: 0}
      reason_codes: [PRO_WITHIN_LIMITS]
      policy_refs: [refund-policy#pro-plan-refunds]
      escalation_reason: null
      tool_trajectory:
        required: [request_verification, prepare_refund]
        allowed: [request_verification, prepare_refund, list_charges, get_account_summary, search_kb]
        forbidden: [create_ticket, prepare_billing_email_change, update_notification_preferences]
        ordering: [{before: request_verification, after: prepare_refund}]
        max_calls: {prepare_refund: 1}
      must_mention: [{any_of: ["$96", "96.00"]}, {any_of: ["0412"]}]
      forbidden: [policy_invented, pin_echoed, commit_without_confirm, commit_same_turn, unneeded_ticket]

