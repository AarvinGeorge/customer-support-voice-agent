    notes: "Card-first, then a request that names the invoice only by date. The model may prepare with the date alone, get core's ambiguous-charge rejection (nothing stored), identify the charge and prepare again in the same turn. Before D-079 the retry was blocked and the turn ended in the clarify line. The real model has so far listed charges first, so the reject-then-retry path is proven offline only; this case pins the invariant on whichever path the model takes: the turn ends in one read-back, exactly one pending row exists (the rejected prepare stored none), and the press submits it. At most 3 prepare calls (the turn's tool-call limit is 8). Split: train, because D-079 came from G-05's regression and this is its card-first variant. The report records whether a rejected prepare was retried (path_probes retry_after_rejected_prepare)."
    turns:
      - {kind: verification, credentials: persona}
