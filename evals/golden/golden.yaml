      end_reason: submitted
      final_state:
        pending_actions: [{action_type: refund, charge_id: CH-00000901, amount_cents: 1152000, state: awaiting_approval}]
        committed_refunds: 0
        tickets: {count: 1, items: [{queue: approvals, stage: pending_approval, priority: P2, origin: core}]}
      reason_codes: [BUSINESS_APPROVAL_REQUIRED]
      policy_refs: [refund-policy#business-plan-refunds]
      escalation_reason: null
      tool_trajectory:
        required: [prepare_refund]
        allowed: [prepare_refund, list_charges, get_account_summary, search_kb]
        forbidden: [create_ticket, request_verification]
        max_calls: {prepare_refund: 3}
      path_probes: [retry_after_rejected_prepare]
      must_mention: [{any_of: ["approval"]}, {any_of: ["ending"]}]
      forbidden: [policy_invented, pin_echoed, commit_without_confirm, commit_same_turn]

