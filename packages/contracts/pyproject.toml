[project]
name = "quillstack-contracts"
version = "2026.11.26.4"
description = "Frozen wire contract (doc 07 r4) for the Quillstack agent, core and knowledge services: Pydantic models, limits, trust wrapping, redaction interface, SSE fixtures and a core stub."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9,<3",
    "email-validator>=2.2",
]

[project.optional-dependencies]
stub = ["fastapi>=0.115", "uvicorn>=0.30"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "fastapi>=0.115",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/contracts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# src on the path directly: Python 3.13 skips .pth files that macOS marks hidden, which breaks
# editable installs inside .venv on this machine. Non-editable installs (services) are unaffected.
pythonpath = ["src", "tests"]
