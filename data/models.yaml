# Model registry (doc 07 s13.2, D-024). Read by agent, knowledge and evals.
# Loaded and validated by services/agent/src/agent/models/config.py (unknown key fails).
# Ids verified 2026-11-27: Anthropic GET /v1/models and OpenAI GET /v1/models listed every id below.
# Prices per 1M tokens, USD, read 2026-11-27 from:
#   Anthropic: platform.claude.com/docs/en/about-claude/pricing
#   OpenAI:    developers.openai.com/api/docs/models/<model id>
# Provider adapters (effort kwarg, cache fields) live in agent/models/, never in callers.
roles:
  agent:
    provider: anthropic
    model: claude-sonnet-5-5
    effort: medium
    attempt_timeout_s: 10
    first_token_timeout_s: 6
    max_tokens: 2048
    price: {input_per_mtok: 2.00, output_per_mtok: 10.00, cache_read_per_mtok: 0.10, cache_write_per_mtok: 2.50, as_of: 2026-11-27}
  agent_fallback:
    # Other provider (doc 07 s8.1). gpt-5.4-mini is the id exercised by the day-1 spikes
    # (tool calls, streaming, 400/429 paths). Upgrade path if the golden set needs it: gpt-5.5
    # (listed by GET /v1/models; $5 in, $0.50 cached, $30 out).
    provider: openai
    model: gpt-5.4-mini
    # none, not low: chat completions rejects function tools with reasoning_effort on gpt-5.4-mini (400, seen live
    # on the first llm_429 fallback, wiring part 1; OpenAI's error names 'none' as the supported value).
    effort: none
    attempt_timeout_s: 10
    first_token_timeout_s: 6
    max_tokens: 2048
    price: {input_per_mtok: 0.75, output_per_mtok: 4.50, cache_read_per_mtok: 0.075, as_of: 2026-11-27}
  grounding_verifier:
    # Gate 2 (doc 07 s7; D-061): 0 retries, fail closed. The client timeout is the chat budget (5 s); voice turns are
    # cut at 3 s by GroundingVerifier (contracts.limits). Prices are the prompts-up-to-100K tier
    # (a Gate 2 prompt is far below that).
    provider: anthropic
    model: claude-haiku-5-5
    # Thinking off: with adaptive thinking (the claude-haiku-5-5 default) the verifier spent all of a 512 cap on
    # reasoning and returned no verdict (browser pass 2, LangSmith). The reply is JSON only; 1536 is over twice a
    # long verdict (GATE_REPLY_MIN_TOKENS in agent/models/config.py). Disabled is accepted at effort high or below.
    effort: low
    thinking: disabled
    attempt_timeout_s: 5
    max_tokens: 1536
    price: {input_per_mtok: 0.10, output_per_mtok: 0.50, cache_read_per_mtok: 0.01, cache_write_per_mtok: 0.125, as_of: 2026-11-27}
  scope_classifier:
    # On a Gate 1 `none` verdict (doc 07 s7): 2 s, 0 retries, failure counts as on-topic.
    provider: anthropic
    model: claude-haiku-5-5
    # Thinking off, as for the verifier: the reply is one word (ON or OFF), so 64 is ample with no reasoning.
    effort: low
    thinking: disabled
    attempt_timeout_s: 2
    max_tokens: 64
    price: {input_per_mtok: 0.10, output_per_mtok: 0.50, cache_read_per_mtok: 0.01, cache_write_per_mtok: 0.125, as_of: 2026-11-27}
  judge:
    # Offline only (golden runner, evals). OpenAI family per doc 07 s13.2.
    provider: openai
    model: gpt-5.5
    attempt_timeout_s: 60
    max_tokens: 1024
    price: {input_per_mtok: 5.00, output_per_mtok: 30.00, cache_read_per_mtok: 0.50, as_of: 2026-11-27}
  embeddings:
    # A change of model or dimensions requires re-ingest and recalibration (doc 07 s13.2).
    provider: openai
    model: text-embedding-3-small
    dimensions: 1536
    attempt_timeout_s: 1.2
    price: {input_per_mtok: 0.02, output_per_mtok: 0.0, as_of: 2026-11-27}
  voice:
    # Written by lane C (CS-E-05.S3.T1, evidence in spikes/realtime/SPIKE_NOTE.md); price added by lane B.
    provider: openai
    model: gpt-realtime-2.1          # GET /v1/models lists it; session.created echoed it
    voice: marin                     # accepted by client_secrets; echoed in session.created
    transcription_model: gpt-transcribe  # accepted with semantic_vad in a realtime session
    # Text and audio rates (developers.openai.com/api/docs/models/gpt-realtime-2.1, read 2026-11-27).
    price: {input_per_mtok: 4.00, output_per_mtok: 24.00, cache_read_per_mtok: 0.40, audio_per_mtok: 32.00, audio_out_per_mtok: 64.00, as_of: 2026-11-27}
