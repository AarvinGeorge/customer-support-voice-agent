# What: promote a tested commit to a release (D-072): release-<tag>.json with the image digests CI pushed for that commit, attached
#   to a GitHub Release. Nothing is built here.
# Use when: the owner pushes a tag r-NN (or r-NN.N for a post-release fix) on a commit of main, or runs this by hand from the
#   Actions tab with `tag` and `sha` (the release then creates the tag at that sha).
# Inputs: the tag and its commit. The commit must be on main, its `ci` run on main (push event) must be green, and the `images`
#   workflow (run after that ci run) must have pushed the four images and uploaded the images-<sha> artifact.
# Output: GitHub Release <tag> with the asset release-<tag>.json (schema 1: revision, repo, per image digest and digest reference).
# Side effects: creates the release (and on workflow_dispatch the tag). Reads the images run's artifact and GHCR; writes no image.
# Role: the only way a set of digests becomes deployable; scripts/deploy/deploy.sh deploys a release tag from this asset.
name: release

on:
  push:
    tags: ["r-*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create (r-NN, or r-NN.N for a fix release; D-072)"
        required: true
        type: string
      sha:
        description: "Commit on main to release (40-character sha; its ci run on main must be green)"
        required: true
        type: string

permissions:
  contents: write   # create the release (and the tag on workflow_dispatch)
  actions: read     # read the ci run and download the images-<sha> artifact of the images run
  packages: read    # read the digests back from GHCR

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve the tag and its commit (on main, release tag format)
        env:
          EVENT: ${{ github.event_name }}
          IN_TAG: ${{ inputs.tag }}
          IN_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = push ]; then TAG="$GITHUB_REF_NAME"; SHA="$(git rev-list -n 1 "refs/tags/$TAG")"; else TAG="$IN_TAG"; SHA="$IN_SHA"; fi
          [[ "$TAG" =~ ^r-[0-9]{2}(\.[0-9]+)?$ ]] || { echo "::error::release tag must look like r-01 or r-01.1 (D-072), got $TAG"; exit 1; }
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::sha must be a full 40-character commit sha"; exit 1; }
          git merge-base --is-ancestor "$SHA" origin/main || { echo "::error::$SHA is not on main: only merged, gated commits are released"; exit 1; }
          if [ "$EVENT" != push ] && git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then echo "::error::tag $TAG already exists"; exit 1; fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "SHA=$SHA" >> "$GITHUB_ENV"
          echo "release $TAG at $SHA"
      - name: Take the images manifest that the images workflow wrote for that commit after its green ci run (never a new build)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ci_run="$(gh run list --workflow ci.yml --branch main --event push --commit "$SHA" --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
          [ -n "$ci_run" ] || { echo "::error::no green ci run on main for $SHA: merge it and wait for ci, then for the images workflow"; exit 1; }
          # The artifact is found by its name; it must come from a successful run of the images workflow.
          img_run="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=images-$SHA&per_page=20" --jq '[.artifacts[] | select(.expired == false)][0].workflow_run.id // empty')"
          [ -n "$img_run" ] || { echo "::error::no images-$SHA artifact: the images workflow has not run (or failed) for $SHA"; exit 1; }
          wf="$(gh run view "$img_run" --json workflowName,conclusion --jq '.workflowName + " " + .conclusion')"
          [ "$wf" = "images success" ] || { echo "::error::artifact images-$SHA comes from run $img_run ($wf), not a successful images run"; exit 1; }
          gh run download "$img_run" --name "images-$SHA" --dir "$RUNNER_TEMP/images"
          echo "images manifest from images run $img_run, gated by ci run $ci_run"
      - name: Write release-<tag>.json and validate it as the deploy will
        run: |
          set -euo pipefail
          python3 scripts/deploy/release_manifest.py release --images "$RUNNER_TEMP/images/images-$SHA.json" --tag "$TAG" --revision "$SHA" --out "release-$TAG.json"
          python3 scripts/deploy/release_manifest.py env --manifest "release-$TAG.json" --tag "$TAG" | tee "$RUNNER_TEMP/release.env"
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Read every digest back from GHCR
        run: |
          set -euo pipefail
          grep '_IMAGE=' "$RUNNER_TEMP/release.env" | while IFS='=' read -r name ref; do
            docker buildx imagetools inspect "$ref" > /dev/null
            echo "present in GHCR: $name $ref"
          done
      - name: Publish the GitHub Release with the manifest attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          notes="Images built once by ci on main for $SHA, after every gate. Deploy: scripts/deploy/deploy.sh up --tag $TAG (scripts/deploy/DEPLOY.md)."
          gh release create "$TAG" "release-$TAG.json" --target "$SHA" --title "$TAG" --notes "$notes"
