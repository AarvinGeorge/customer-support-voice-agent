# What: the CI gate for every pull request and every push to main (CS-E-01.S5.T1; doc 06 s10; doc 07 s1.4, s15.1 row 5).
# Use when: GitHub runs it automatically. Make the jobs below required checks in branch protection (owner gap G1).
# Inputs: the repo. Needs no secrets (tests use fakes; nothing here calls a provider).
# Output: one green or red check per job: python (ruff, pyright, pytest per project incl. infra), repo tests, web, gitleaks, contracts-sync, import-guard, descriptors, compose, pg tests;
#   then `images`, after every gate: the four service images built once and pushed to GHCR, plus the images-<sha> manifest artifact (D-072).
# Side effects: `images` pushes to ghcr.io/aarvingeorge/customer-support-voice-agent/<image> (tag <sha> on main, pr-<n> on a same-repo
#   pull request); nothing else beyond the run itself. Role: the merge gate and the one place images are built. Every run step starts with `set -euo pipefail`.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}  # never cancel a run on main

jobs:
  python:
    name: python (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # pyright_target: what pyright checks (empty = the whole project, tests included, all hard).
        include:
          - {project: packages/contracts, pyright_target: ""}
          - {project: services/agent, pyright_target: ""}
          - {project: services/core, pyright_target: ""}
          - {project: services/knowledge, pyright_target: ""}
          - {project: scripts, pyright_target: ""}
          - {project: evals, pyright_target: ""}
          - {project: infra, pyright_target: ""}
    env:
      REQUIRE_ARTICLES: "1"  # the policy article tests fail instead of skipping (packages/contracts tests, PR #7)
    defaults:
      run:
        shell: bash
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.22"
      - name: Sync dependencies
        run: |
          set -euo pipefail
          if [ -f pyproject.toml ]; then uv sync --frozen; else echo "no pyproject.toml here (stdlib scripts), nothing to sync"; fi
      - name: ruff
        run: |
          set -euo pipefail
          uvx ruff@0.9.10 check .
          if [ "${{ matrix.project }}" = "scripts" ]; then uvx ruff@0.9.10 check ../tests; fi  # root tests/ has no project of its own
      - name: pyright
        run: |
          set -euo pipefail
          if [ -f pyproject.toml ]; then
            uv run --frozen --with pyright==1.1.405 pyright ${{ matrix.pyright_target }}
          else
            # infra/migrate.py imports psycopg (the service images carry it), so pyright gets the same version the services lock.
            uv run --no-project --with "psycopg[binary]==3.3.9" --with pyright==1.1.405 pyright .
          fi
      - name: pytest
        run: |
          set -euo pipefail
          # No quiet branches: a project without tests fails, and so does any skipped test (a skip is a green run
          # that tested nothing; same rule as scripts/pg_tests.sh). Deselected markers (pg, real, e2e) are not skips.
          # No -q here: some projects already set -q in addopts and two -q drop the summary line the checks below read.
          out="$(mktemp)"
          if [ ! -f pyproject.toml ]; then
            uv run --no-project --with pytest==8.3.5 --with pyyaml pytest -rs . 2>&1 | tee "$out"
          elif [ -d tests ]; then
            uv run --frozen --with pytest pytest -rs 2>&1 | tee "$out"
          else
            echo "::error title=${{ matrix.project }}::no tests/ directory: every project in this matrix must have tests"
            exit 1
          fi
          if grep -qE '[0-9]+ (skipped|xfailed|xpassed)' "$out"; then echo "::error title=${{ matrix.project }}::pytest skipped tests (or xfail) tests: they must run or be deselected by marker"; exit 1; fi
          if ! grep -qE '[0-9]+ passed' "$out"; then echo "::error title=${{ matrix.project }}::pytest passed nothing"; exit 1; fi

  repo-tests:
    name: repo tests (tests/ and keys)
    runs-on: ubuntu-latest
    env:
      REQUIRE_ARTICLES: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.22"
      - name: Root tests (need the contracts package) and scripts/test_keys.py
        run: |
          set -euo pipefail
          out="$(mktemp)"
          uv run --no-project --with pytest==8.3.5 --with pyyaml --with ./packages/contracts pytest -q -rs tests scripts/test_keys.py 2>&1 | tee "$out"
          if grep -qE '[0-9]+ (skipped|xfailed|xpassed)' "$out"; then echo "::error::pytest skipped (or xfail) tests: they must run"; exit 1; fi
          if ! grep -qE '[0-9]+ passed' "$out"; then echo "::error::pytest passed nothing"; exit 1; fi

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Enable pnpm via corepack
        run: |
          set -euo pipefail
          corepack enable
          pnpm --version
      - name: Install
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
      - name: Lint
        run: |
          set -euo pipefail
          pnpm lint
      - name: Unit tests (vitest)
        run: |
          set -euo pipefail
          pnpm test
      - name: Build
        run: |
          set -euo pipefail
          pnpm build
      - name: Typecheck
        run: |
          set -euo pipefail
          pnpm typecheck
      - name: Bundle test
        run: |
          set -euo pipefail
          pnpm test:bundle

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan history and tree
        run: |
          set -euo pipefail
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz
          echo "a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks detect --source . --redact --verbose --exit-code 1

  contracts-sync:
    name: contracts sync
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: packages/contracts
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.22"
      - name: Regenerate fixtures and TypeScript, then require no diff
        run: |
          set -euo pipefail
          uv sync --frozen
          uv run --frozen python scripts/build_fixtures.py
          uv run --frozen python scripts/gen_ts.py
          git diff --exit-code -- . || { echo "Generated contract files are stale: run build_fixtures.py and gen_ts.py and commit the result"; exit 1; }
          if [ -n "$(git status --porcelain -- .)" ]; then git status --short -- .; echo "Untracked generated files"; exit 1; fi

  import-guard:
    name: import guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.22"
      - name: No commit or ops client import in agent tool modules
        run: |
          set -euo pipefail
          uv run --no-project --with pytest==8.3.5 pytest -q scripts/test_import_guard.py
          python3 scripts/check_import_guard.py

  descriptors:
    name: descriptors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the check needs the merge base with origin/main
      - name: Every module, class and function in every tracked .py/.ts/.tsx file has the six D-015 labels (tests and spikes need the module descriptor only)
        run: |
          set -euo pipefail
          # Changed files only (D-015). On a pull request the base is origin/main; on a push to main it is the previous
          # commit (a merge commit's first parent, so the whole PR). Full-repo check below.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python3 scripts/check_descriptors.py --base origin/main
          else
            python3 scripts/check_descriptors.py --base HEAD^
          fi
          # Full repo is at 0 gaps (backfill), so keep it strict: any gap anywhere fails the job.
          python3 scripts/check_descriptors.py --all

  compose:
    name: compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate both stack forms
        run: |
          set -euo pipefail
          docker compose --env-file .env.example config -q
          docker compose --env-file .env.example -f compose.yaml config -q
          # The deploy form (D-072): every built service takes a digest-pinned release image and has no build section left.
          d="sha256:$(printf '0%.0s' $(seq 64))"
          AGENT_IMAGE="ghcr.io/x/agent@$d" CORE_IMAGE="ghcr.io/x/core@$d" KNOWLEDGE_IMAGE="ghcr.io/x/knowledge@$d" WEB_IMAGE="ghcr.io/x/web@$d" \
            docker compose --env-file .env.example -f compose.yaml -f scripts/deploy/compose.release.yaml --profile seed --profile jobs config --format json \
            | python3 -c 'import json,sys; s=json.load(sys.stdin)["services"]; b=[n for n,v in s.items() if "build" in v]; u=[n for n,v in s.items() if "@sha256:" not in v.get("image","") and n not in ("caddy","postgres","redis")]; assert not b and not u, (b, u); print("release form: no build section;", len(s) - 3, "services pinned by digest")'
          # Static topology proof (core and knowledge off the edge network, env scoping, grace period); reads .env.
          cp .env.example .env
          python3 infra/tests/check_topology.py

  pg-tests:
    name: pg tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.22"
      - name: Postgres-backed tests (pytest -m pg) for core, knowledge and agent
        run: |
          set -euo pipefail
          # Starts the Compose pgvector Postgres with dummy random passwords (generated inside the script, no secrets),
          # builds the schemas with the migrate jobs, then runs each service's `pg` tests. No provider is called
          # (fixture vectors). Fails if a pg test fails, errors, or is skipped. See scripts/pg_tests.sh.
          scripts/pg_tests.sh
      - name: Deploy backup and restore against a real Postgres (add-a-table, corrupt and wrong-release cases)
        run: |
          set -euo pipefail
          scripts/deploy/restore_pg_test.sh

  # Build once, after every gate (D-072). A push to main tags each image with the commit sha and writes images-<sha>.json, the only
  # digests a release may name (.github/workflows/release.yml). A same-repo pull request runs the same path as a dry run under the
  # tag pr-<n>, which no release can name. Build definitions come from compose.yaml (bake reads its build sections), so CI builds
  # exactly what local Compose builds; the migrate, seed and ingest jobs share these four images (scripts/deploy/compose.release.yaml).
  images:
    name: images (build once, push to GHCR)
    needs: [python, repo-tests, web, gitleaks, contracts-sync, import-guard, descriptors, compose, pg-tests]
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR with this run's token (expires with the job)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build agent, core, knowledge and web once with OCI labels and push
        env:
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          LANGSMITH_PROJECT: ${{ vars.LANGSMITH_PROJECT }}          # public build args of the web image (no secret)
          LANGSMITH_PROJECT_URL: ${{ vars.LANGSMITH_PROJECT_URL }}
        run: |
          set -euo pipefail
          repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          if [ "$EVENT" = push ]; then name="$GITHUB_SHA"; else name="pr-$PR"; fi
          sets=()
          for pair in agent:agent_a core:core knowledge:knowledge web:web; do
            img="${pair%%:*}"; target="${pair##*:}"
            sets+=(--set "$target.tags=$repo/$img:$name" --set "$target.labels.org.opencontainers.image.title=$img")
          done
          docker buildx bake -f compose.yaml "${sets[@]}" \
            --set "*.labels.org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --set "*.labels.org.opencontainers.image.revision=$GITHUB_SHA" \
            --push --metadata-file "$RUNNER_TEMP/bake-meta.json" agent_a core knowledge web
          python3 scripts/deploy/release_manifest.py images --bake-metadata "$RUNNER_TEMP/bake-meta.json" --revision "$GITHUB_SHA" \
            --repo "$repo" --name "$name" --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --out "images-$GITHUB_SHA.json"
          cat "images-$GITHUB_SHA.json"
      - name: Read back every pushed digest from GHCR (labels included)
        run: |
          set -euo pipefail
          for ref in $(python3 -c 'import json,sys; [print(v["ref"]) for v in json.load(open(sys.argv[1]))["images"].values()]' "images-$GITHUB_SHA.json"); do
            docker buildx imagetools inspect "$ref" --format '{{json .Image}}' > "$RUNNER_TEMP/img.json"
            python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); d=d.get("linux/amd64", d); l=d["config"]["Labels"]; assert l["org.opencontainers.image.revision"]==sys.argv[2], l; print(sys.argv[3], "revision", l["org.opencontainers.image.revision"], "source", l["org.opencontainers.image.source"])' "$RUNNER_TEMP/img.json" "$GITHUB_SHA" "$ref"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: images-${{ github.sha }}
          path: images-${{ github.sha }}.json
          if-no-files-found: error
          retention-days: 90
