# What: the CI gate for every pull request and every push to main (CS-E-01.S5.T1; doc 06 s10; doc 07 s1.4, s15.1 row 5).
# Use when: GitHub runs it automatically (the merge gate). Backup (D-068): if Actions cannot run, scripts/ci_gate.sh runs
#   the same checks locally on the PR merged onto main and posts the `local-ci` status.
# Inputs: the repo. Needs no secrets (tests use fakes; nothing here calls a provider).
# Output: one green or red check per job: python (ruff, pyright, pytest per project incl. infra), repo tests, web, gitleaks, contracts-sync, import-guard, descriptors, compose, pg tests.
# Side effects: none beyond the run itself. Role: the merge gate. ONE source of truth (D-068): every job only sets up the
#   toolchain and runs `scripts/ci_local.sh <job>`; the commands, versions and skip rules live in that script.
#   Images are built after this gate passes on main, by .github/workflows/images.yml (D-072), never here.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}  # never cancel a run on main

jobs:
  python:
    name: python (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Must equal PYTHON_PROJECTS in scripts/ci_local.sh (scripts/test_ci_local.py checks it). Per-project rules
        # (pyright with psycopg for infra, ruff on the root tests/ in the scripts job) live in ci_local.sh.
        project: [packages/contracts, services/agent, services/core, services/knowledge, scripts, evals, infra]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.22"
      - name: ruff, pyright, pytest (scripts/ci_local.sh)
        run: |
          set -euo pipefail
          scripts/ci_local.sh "python:${{ matrix.project }}"

  repo-tests:
    name: repo tests (tests/ and keys)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.22"
      - name: Root tests and scripts/test_keys.py (scripts/ci_local.sh)
        run: |
          set -euo pipefail
          scripts/ci_local.sh repo-tests

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: install, lint, vitest, build, typecheck, bundle test (scripts/ci_local.sh)
        run: |
          set -euo pipefail
          scripts/ci_local.sh web

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan history and tree (scripts/ci_local.sh, pinned gitleaks 8.28.0)
        run: |
          set -euo pipefail
          scripts/ci_local.sh gitleaks

  contracts-sync:
    name: contracts sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.22"
      - name: Regenerate fixtures and TypeScript, then require no diff (scripts/ci_local.sh)
        run: |
          set -euo pipefail
          scripts/ci_local.sh contracts-sync

  import-guard:
    name: import guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.22"
      - name: No commit or ops client import in agent tool modules (scripts/ci_local.sh)
        run: |
          set -euo pipefail
          scripts/ci_local.sh import-guard

  descriptors:
    name: descriptors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the check needs the merge base with origin/main
      - name: Every module, class and function in changed .py/.ts/.tsx files has the six D-015 labels (scripts/ci_local.sh)
        env:
          # Pull request: base origin/main. Push to main: the previous commit (a merge commit's first parent, so the whole PR).
          CI_DESCRIPTORS_BASE: ${{ github.event_name == 'pull_request' && 'origin/main' || 'HEAD^' }}
        run: |
          set -euo pipefail
          scripts/ci_local.sh descriptors

  compose:
    name: compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate both stack forms and the static topology (scripts/ci_local.sh)
        run: |
          set -euo pipefail
          scripts/ci_local.sh compose

  pg-tests:
    name: pg tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.22"
      - name: Postgres-backed tests and deploy backup and restore (scripts/ci_local.sh)
        run: |
          set -euo pipefail
          scripts/ci_local.sh pg-tests
