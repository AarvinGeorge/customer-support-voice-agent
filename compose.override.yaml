# Local dev conveniences (picked up automatically by `docker compose up`; the VM uses `-f compose.yaml` only).
# Source is mounted and uvicorn reloads on change; Caddy is published on localhost:3000 (SITE_ORIGIN).
# SERVICE and FORWARDED_ALLOW_IPS are read inside the container (the image sets SERVICE), hence the doubled dollar.
x-dev-python: &dev-python
  command: ["sh", "-c", "uvicorn $${SERVICE}.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/src --proxy-headers --forwarded-allow-ips \"$${FORWARDED_ALLOW_IPS:-127.0.0.1}\""]

services:
  caddy:
    ports: !override ["127.0.0.1:3000:80"]
  agent_a:
    <<: *dev-python
    volumes: ["./services/agent/src:/app/src"]
  agent_b:
    <<: *dev-python
    volumes: ["./services/agent/src:/app/src"]
  core:
    <<: *dev-python
    volumes: ["./services/core/src:/app/src"]
  knowledge:
    <<: *dev-python
    volumes: ["./services/knowledge/src:/app/src"]
