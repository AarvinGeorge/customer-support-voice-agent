# What: pytest settings for the repo-level tests (tests/, scripts/); the services, contracts, evals and infra
# projects carry their own config.
# Use when: pytest runs from the repo root or from scripts/.
# Inputs: none. Output: marker registration and the default selection.
# Side effects: none. Role: planning_docs tests need the planning-docs folder, which is outside this repository,
# so they are deselected by default (never skipped); run them in the project checkout with `pytest -m planning_docs`.
[pytest]
markers =
    planning_docs: needs the planning-docs folder next to the repo (not in CI)
addopts = -m "not planning_docs"
